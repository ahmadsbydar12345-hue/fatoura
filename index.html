<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>فاتورة برو - أداة عربية مجانية للفواتير والعملاء</title><meta name="description" content="فاتورة برو: أداة عربية مجانية لعمل الفواتير وعروض الأسعار وإدارة العملاء والمدفوعات والمصروفات، مع إرسال على واتساب وطباعة PDF."><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--text:#1a1d24;--mu:#6b7280;--line:#e3e6ea;--ac:#0f766e;--act:#fff;--red:#dc2626;--grn:#16a34a}

:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f27;--text:#eef0f3;--mu:#9aa1ad;--line:#2d313b;--ac:#2dd4bf;--act:#06201d}
*{box-sizing:border-box}body{margin:0;display:flex;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
nav{width:190px;background:var(--card);border-left:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
nav b{font-size:18px;margin-bottom:10px}nav a{padding:9px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:15px}nav a.on{background:var(--ac);color:var(--act)}
#main{flex:1;min-width:0;padding:16px;max-width:1100px}
@media(max-width:800px){body{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;border:0;border-bottom:1px solid var(--line);align-items:center}nav b{margin:0 4px}nav a{white-space:nowrap}}
h1{margin:0 0 12px;font-size:22px}h3{margin:12px 0 6px;font-size:15px}h2{margin:2px 0}small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.gs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.gs .card{margin:0}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea,button,.btn{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:100%}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input,.bar select{flex:1;min-width:120px;width:auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}.t th{text-align:right;color:var(--mu);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}

.b{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}.b.paid{background:#dcfce7;color:#166534}.b.due{background:#fef3c7;color:#92400e}.b.over{background:#fee2e2;color:#991b1b}
.ch{display:flex;gap:6px;align-items:flex-end;height:170px}.ch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px}.ch i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}

.ed{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.ed{grid-template-columns:1fr}}
.it{display:grid;grid-template-columns:3fr 1fr 1.3fr auto;gap:5px;margin-top:6px}
.pv{position:relative;background:#fff;color:#111;padding:26px;border-radius:12px;border:1px solid var(--line);--pa:#0f766e}
.pv h2{font-size:26px;color:var(--pa)}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--pa);padding-bottom:12px}
.meta{font-size:13px;color:#444;text-align:left}.pt{margin:14px 0;font-size:14px}.pt b{display:block;color:var(--pa);font-size:12px}
.pv th{background:#f0f4f4;text-align:right;padding:8px}.pv td{padding:8px;border-bottom:1px solid #eee}
.tot{margin:14px 0 0 auto;width:260px;max-width:100%;font-size:14px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{border-top:2px solid var(--pa);font-weight:700;font-size:17px;margin-top:4px;padding-top:8px}
.notes{margin-top:18px;font-size:13px;color:#555;white-space:pre-wrap}.logo{max-height:56px;max-width:180px;display:block;margin-bottom:6px}
.stamp{position:absolute;top:110px;left:28px;transform:rotate(-15deg);border:3px solid #16a34a;color:#16a34a;padding:2px 14px;font-size:22px;font-weight:700;opacity:.8;border-radius:6px}
.t-modern .top{background:var(--pa);color:#fff;padding:14px;border:0;border-radius:8px}.t-modern .top h2,.t-modern .meta{color:#fff}
.t-minimal .top{border-bottom:1px solid #ccc}.t-minimal h2{color:#111}.t-minimal th{background:none;border-bottom:2px solid #111}
body{font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px}
nav{background:linear-gradient(180deg,#0f766e,#134e4a);border:0;color:#fff;gap:6px}nav b{color:#fff;font-size:20px;padding:6px 8px}
nav a{color:#ffffffd9}nav a:hover{background:#ffffff1f}nav a.on{background:#fff;color:#0f766e;font-weight:700}
h1{font-size:26px;font-weight:700}.card{border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);padding:18px}
input,select,textarea{border-radius:10px;padding:10px 12px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
button:hover,.btn:hover{border-color:var(--ac);color:var(--ac)}.pr:hover,.chip.on:hover{color:var(--act);filter:brightness(1.08)}
.sc{border-top:4px solid var(--ac);transition:transform .15s}.sc:hover{transform:translateY(-2px)}
.gs .sc:nth-child(2){border-top-color:var(--grn)}.gs .sc:nth-child(3){border-top-color:#d97706}.gs .sc:nth-child(4){border-top-color:var(--red)}
.sec h3{margin:0}.sec p{margin:2px 0 8px;font-size:13px}.u{display:flex;gap:6px}.u select{width:84px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.chip{padding:8px 16px;border-radius:99px}.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}.sw.on{box-shadow:0 0 0 3px var(--ac)}
.stick{position:sticky;top:12px}.t tr:hover td{background:var(--bg)}
.b.part{background:#dbeafe;color:#1e40af}.b.quote{background:#e5e7eb;color:#374151}.sc{text-decoration:none;color:var(--text);display:block}.r2 .btn{width:100%;text-align:center;padding:10px}
@page{size:A4;margin:14mm}
@media print{.pv{font-size:17px}.pv h2{font-size:36px}.pv table{font-size:16px}.pv .top{padding-bottom:18px}.pv .meta{font-size:15px}.pv .pt{font-size:16px;margin:22px 0}.pv .tot{width:380px;font-size:17px}.pv .tot .g{font-size:21px}.pv .notes{font-size:15px}.pv td,.pv th{padding:12px 8px}.logo{max-height:80px}body{display:block;background:#fff}nav,#ef,h1{display:none!important}.ed{display:block}.pv{border:0;padding:0}}
</style></head><body>
<nav><b>🧾 فاتورة برو</b><a href="#/">🏠 الرئيسية</a><a href="#/invoices">🧾 الفواتير</a><a href="#/clients">👥 العملاء</a><a href="#/products">📦 المنتجات</a><a href="#/expenses">💸 المصروفات</a><a href="#/reports">📊 التقارير</a><a href="#/settings">⚙️ الإعدادات</a></nav>
<div id="main"></div>
<script>
const $=s=>document.querySelector(s),M=()=>$('#main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
let S;try{S=JSON.parse(localStorage.getItem('inv2'))}catch(e){}
S=S||{set:{name:'',logo:'',cur:'ج.م',tax:0,color:'#0f766e',tpl:'classic',pre:'INV-',next:1},clients:[],products:[],inv:[]};
const DR='مرحباً {عميل}،\nتذكير ودّي بخصوص الفاتورة رقم {رقم}\nالمتبقي: {متبقي}\nكان تاريخ استحقاقها: {استحقاق}\nلو تم الدفع تجاهل الرسالة، وشكراً 🌹',DQ='مرحباً {عميل}،\nعرض السعر رقم {رقم} من {نشاط}\nالإجمالي: {إجمالي}\nصالح حتى: {استحقاق}\nفي انتظار موافقتك 🌹';
const DM='مرحباً {عميل}،\nفاتورتك رقم {رقم} من {نشاط}\nالإجمالي: {إجمالي}\nتاريخ الاستحقاق: {استحقاق}\nشكراً لتعاملك معنا 🌹';
S.exp=S.exp||[];S.set=Object.assign({rmsg:DR,qn:1,taxT:'pct',cc:'20',dd:14,msg:DM,notes:'',biz:'',pay:'',theme:'auto'},S.set);let Q='';
if(S.set.theme!=='auto')document.documentElement.dataset.theme=S.set.theme;
const addD=n=>{if(!+n)return'';const d=new Date();d.setDate(d.getDate()+ +n);return d.toISOString().slice(0,10)};
const sv=()=>{try{localStorage.setItem('inv2',JSON.stringify(S))}catch(e){}};
const nn=()=>S.set.pre+String(S.set.next).padStart(3,'0');
const tot=i=>{const sub=i.items.reduce((a,x)=>a+x.q*x.p,0),d=i.discT==='pct'?sub*(+i.disc||0)/100:Math.min(+i.disc||0,sub),ad=Math.max(sub-d,0),tx=i.taxT==='amt'?(+i.tax||0):ad*(+i.tax||0)/100;return{sub,d,tx,t:ad+tx}};
const st=i=>i.type==='quote'?'quote':i.status==='paid'?'paid':(i.due&&i.due<today()?'over':((i.pays||[]).length?'part':'due'));
const SL={paid:'مدفوعة',over:'متأخرة',due:'مستحقة',part:'مدفوعة جزئياً',quote:'عرض سعر'},badge=i=>`<span class="b ${st(i)}">${SL[st(i)]}</span>`;
const sumP=i=>(i.pays||[]).reduce((s,x)=>s+x.a,0),paidAmt=i=>i.status==='paid'?tot(i).t:sumP(i),rem=i=>Math.max(tot(i).t-paidAmt(i),0),IV=()=>S.inv.filter(i=>i.type!=='quote');
const addDt=(b,n)=>{const d=new Date(b);d.setDate(d.getDate()+ +n);return d.toISOString().slice(0,10)};
const addPer=(b,r)=>{const d=new Date(b);r==='w'?d.setDate(d.getDate()+7):r==='m'?d.setMonth(d.getMonth()+1):d.setFullYear(d.getFullYear()+1);return d.toISOString().slice(0,10)};
const pays=i=>{const p=(i.pays||[]).slice(),s=sumP(i),t=tot(i).t;if(i.status==='paid'&&t>s)p.push({d:p.length?p[p.length-1].d:i.date,a:t-s});return p};
function runRec(){let ch=false;S.inv.slice().forEach(i=>{if(!i.rec||!i.nxt)return;let n=0;while(i.nxt<=today()&&n++<12){const c=JSON.parse(JSON.stringify(i));c.id=uid();c.num=nn();S.set.next++;c.date=i.nxt;c.due=S.set.dd?addDt(c.date,S.set.dd):'';c.status='due';c.pays=[];c.rec='';delete c.nxt;S.inv.unshift(c);i.nxt=addPer(i.nxt,i.rec);ch=true}});if(ch)sv()}
function pv(i){const t=tot(i),c=i.cur,s=S.set;return `<div class="pv t-${s.tpl}" style="--pa:${s.color}">${i.status==='paid'?'<div class="stamp">مدفوعة</div>':''}<div class="top"><div>${s.logo?`<img class="logo" src="${s.logo}" alt="">`:''}<h2>${i.type==='quote'?'عرض سعر':'فاتورة'}</h2><div>${esc(s.name||'اسم شركتك')}</div><div style="font-size:12px;white-space:pre-wrap">${esc(s.biz)}</div></div><div class="meta">رقم: ${esc(i.num)}<br>التاريخ: <bdi dir="ltr">${fD(i.date)}</bdi>${i.due?`<br>${i.type==='quote'?'صالح حتى':'الاستحقاق'}: <bdi dir="ltr">${fD(i.due)}</bdi>`:''}</div></div><div class="pt"><b>${i.type==='quote'?'عرض إلى':'فاتورة إلى'}</b>${esc(i.client||'—')}</div><div class="tw"><table><tr><th>الوصف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${i.items.map(x=>`<tr><td>${esc(x.d||'—')}</td><td>${(+x.q).toLocaleString('ar-EG')}</td><td>${fmt(x.p)}</td><td>${fmt(x.q*x.p)}</td></tr>`).join('')}</table></div><div class="tot"><div><span>المجموع</span><span>${fmt(t.sub)} ${c}</span></div>${t.d?`<div><span>الخصم${i.discT==='pct'?` (<bdi dir="ltr">${i.disc}%</bdi>)`:''}</span><span>- ${fmt(t.d)} ${c}</span></div>`:''}${t.tx?`<div><span>الضريبة${i.taxT==='amt'?'':` (<bdi dir="ltr">${i.tax}%</bdi>)`}</span><span>${fmt(t.tx)} ${c}</span></div>`:''}<div class="g"><span>الإجمالي</span><span>${fmt(t.t)} ${c}</span></div>${i.type!=='quote'&&paidAmt(i)>0&&i.status!=='paid'?`<div><span>المدفوع</span><span>${fmt(paidAmt(i))} ${c}</span></div><div style="font-weight:700"><span>المتبقي</span><span>${fmt(rem(i))} ${c}</span></div>`:''}</div>${i.notes?`<div class="notes">${esc(i.notes)}</div>`:''}${s.pay?`<div class="notes"><b>بيانات الدفع:</b>\n${esc(s.pay)}</div>`:''}</div>`}
const fD=s=>s?s.split('-').reverse().join('/'):'—';
const msgOf=(i,k)=>{const T=k==='r'?S.set.rmsg:i.type==='quote'?DQ:S.set.msg;return (T||'').replace(/\{(.*?)\}/g,(m,x)=>({'رقم':i.num,'عميل':i.client,'إجمالي':fmt(tot(i).t)+' '+i.cur,'متبقي':fmt(rem(i))+' '+i.cur,'نشاط':S.set.name,'استحقاق':fD(i.due)}[x]??m)).replace(/ من[ \t]*$/gm,'').split('\n').map(l=>'\u200F'+l).join('\n')};
function waUrl(i,k){const c=S.clients.find(x=>x.name===i.client);let p=(c&&c.phone||'').replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p=S.set.cc+p.slice(1);return `https://wa.me/${p}?text=${encodeURIComponent(msgOf(i,k))}`}
function printDoc(i){return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاتورة ${esc(i.num)}</title><style>${document.querySelector('style').textContent}body{display:block;background:#fff;padding:16px;max-width:800px;margin:auto}@media print{body{max-width:none;padding:0;margin:0}}</style></head><body>${pv(i)}<script>onload=()=>setTimeout(print,400)<\/script></body></html>`}
function chart(n){const ks=[],d=new Date();d.setDate(1);for(let k=0;k<n;k++){ks.unshift(d.toISOString().slice(0,7));d.setMonth(d.getMonth()-1)}const v=ks.map(k=>IV().filter(i=>i.date.slice(0,7)===k).reduce((s,i)=>s+tot(i).t,0)),m=Math.max(...v,1);return `<div class="ch">${ks.map((k,j)=>`<div><small>${v[j]?fmt(v[j]):''}</small><i style="height:${v[j]/m*80}%"></i><small>${k.slice(5)}</small></div>`).join('')}</div>`}
function table(a){return a.length?`<div class="tw"><table class="t"><tr><th>#</th><th>العميل</th><th>التاريخ</th><th>الإجمالي</th><th>الحالة</th><th></th></tr>${a.map(i=>{const s=st(i),q=s==='quote';return `<tr><td>${esc(i.num)}${i.rec?' 🔁':''}</td><td>${esc(i.client||'—')}</td><td>${fD(i.date)}</td><td>${fmt(tot(i).t)} ${i.cur}${!q&&s!=='paid'&&paidAmt(i)>0?`<br><small>متبقي ${fmt(rem(i))}</small>`:''}</td><td>${badge(i)}</td><td class="ac"><a class="btn" href="#/edit/${i.id}">فتح</a><button data-a="dup" data-id="${i.id}">نسخ</button>${q?`<button data-a="conv" data-id="${i.id}">تحويل لفاتورة</button>`:`<button data-a="pay" data-id="${i.id}">${s==='paid'?'إلغاء الدفع':'تم الدفع'}</button>`}<a class="btn" target="_blank" rel="noopener" href="${waUrl(i)}">واتساب</a>${!q&&s!=='paid'?`<a class="btn" target="_blank" rel="noopener" href="${waUrl(i,'r')}">تذكير</a>`:''}<button data-a="del" data-id="${i.id}">حذف</button></td></tr>`}).join('')}</table></div>`:'<p class="mu">لا توجد نتائج.</p>'}
function dash(){const a=IV(),all=S.inv,sm=f=>a.filter(f).reduce((s,i)=>s+rem(i),0),ct=f=>a.filter(f).length,T=a.reduce((s,i)=>s+tot(i).t,0),P=a.reduce((s,i)=>s+paidAmt(i),0),ex=S.exp.reduce((s,x)=>s+x.a,0),D=i=>['due','part'].includes(st(i)),cd=(t,v,n,c,s)=>`<a class="card sc" href="#/invoices${s?'?s='+s:''}"><small>${t}</small><h2 style="color:${c}">${fmt(v)} <small>${S.set.cur}</small></h2><small>${n} فاتورة</small></a>`;
M().innerHTML=`<h1>لوحة التحكم</h1><div class="gs">${cd('إجمالي الفواتير',T,a.length,'var(--text)','')}${cd('المحصّل',P,ct(i=>st(i)==='paid'),'var(--grn)','paid')}${cd('مستحق (متبقي)',sm(D),ct(D),'#d97706','due')}${cd('متأخر (متبقي)',sm(i=>st(i)==='over'),ct(i=>st(i)==='over'),'var(--red)','over')}</div><div class="gs"><div class="card"><small>نسبة التحصيل</small><h2>${T?Math.round(P/T*100):0}%</h2></div><div class="card"><small>صافي الربح (محصّل − مصروفات)</small><h2>${fmt(P-ex)}</h2></div><div class="card"><small>عروض أسعار</small><h2>${all.length-a.length}</h2></div></div><div class="card"><h3>آخر 6 شهور</h3>${chart(6)}</div><div class="card"><h3>آخر الفواتير</h3>${table(all.slice(0,5))}</div><a class="btn pr" href="#/edit">+ فاتورة جديدة</a> <a class="btn" href="#/edit?type=quote">+ عرض سعر</a>`}
function list(){const cl=[...new Set(S.inv.map(i=>i.client).filter(Boolean))];M().innerHTML=`<h1>الفواتير</h1><div class="bar"><input id="q" placeholder="بحث بالعميل أو الرقم"><select id="fs"><option value="">الكل</option><option value="paid">مدفوعة</option><option value="due">مستحقة</option><option value="over">متأخرة</option><option value="quote">عروض أسعار</option></select><a class="btn pr" href="#/edit">+ فاتورة</a><a class="btn" href="#/edit?type=quote">+ عرض سعر</a></div><div class="bar"><select id="fc"><option value="">كل العملاء</option>${cl.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="d1" type="date" title="من"><input id="d2" type="date" title="إلى"><select id="so"><option value="n">الأحدث</option><option value="o">الأقدم</option><option value="h">الأعلى مبلغاً</option><option value="l">الأقل مبلغاً</option></select></div><div class="card" id="tb"></div>`;
